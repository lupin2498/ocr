name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Dòng Tesseract đã kiểm chứng cho tiếng Việt (5.4.0 làm mất dấu ở chữ in hoa / ô bảng)
  TESSERACT_SERIES: "5.3."

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Đọc phiên bản
        id: ver
        run: |
          $v = python -c "import ocr_tool; print(ocr_tool.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Tải Tesseract-OCR (bản Windows của UB Mannheim) và giải nén
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path build\tesseract | Out-Null
          # Máy chủ UB Mannheim lưu đầy đủ các phiên bản; GitHub Releases chỉ giữ bản mới nhất
          $names = @()
          try {
            $html = (Invoke-WebRequest -Uri "https://digi.bib.uni-mannheim.de/tesseract/" -UseBasicParsing).Content
            $names = @([regex]::Matches($html, 'tesseract-ocr-w64-setup-(\d+\.\d+\.\d+\.\d+)\.exe') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique -Descending)
          } catch { Write-Host "Không đọc được digi.bib.uni-mannheim.de: $_" }
          Write-Host "Các bản có sẵn: $($names -join ', ')"
          $series = "${{ env.TESSERACT_SERIES }}"
          $ver = $names | Where-Object { $_.StartsWith($series) } | Select-Object -First 1
          if ($ver) {
            $url = "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-$ver.exe"
          } else {
            Write-Host "Không có bản ${series}x, dùng bản mới nhất trên GitHub"
            $url = gh api repos/UB-Mannheim/tesseract/releases/latest --jq '.assets[] | select(.name | test("w64-setup.*\\.exe$")) | .browser_download_url' 2>$null | Select-Object -First 1
          }
          if (-not $url -or -not "$url".StartsWith("https://")) { throw "Không tìm thấy bản cài Tesseract" }
          Write-Host "Tải: $url"
          Invoke-WebRequest -Uri $url -OutFile build\tesseract-setup.exe
          7z x build\tesseract-setup.exe -obuild\tesseract -y | Out-Null
          Get-ChildItem build\tesseract -Directory | Where-Object { $_.Name -like '$*' } | Remove-Item -Recurse -Force
          if (-not (Test-Path build\tesseract\tesseract.exe)) { throw "Giải nén Tesseract thất bại" }
          & build\tesseract\tesseract.exe --version

      - name: Tải dữ liệu ngôn ngữ vie / eng / rus (tessdata_best)
        run: |
          foreach ($l in @("vie", "eng", "rus", "osd")) {
            $dst = "build\tesseract\tessdata\$l.traineddata"
            $repo = if ($l -eq "osd") { "tessdata" } else { "tessdata_best" }
            Write-Host "Tải $l ..."
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/$repo/raw/main/$l.traineddata" -OutFile $dst
          }
          Get-ChildItem build\tesseract\tessdata
          & build\tesseract\tesseract.exe --list-langs

      - name: Chẩn đoán chất lượng OCR (tham khảo)
        continue-on-error: true
        env:
          TESSERACT_CMD: ${{ github.workspace }}\build\tesseract\tesseract.exe
        run: |
          python tools\diag_sample.py
          python tools\diag_detail.py
          $env:OMP_THREAD_LIMIT = "1"
          python tools\diag_detail.py

      - name: Kiểm thử trên Windows
        env:
          TESSERACT_CMD: ${{ github.workspace }}\build\tesseract\tesseract.exe
        run: python -m pytest tests -q

      - name: Đóng gói bằng PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean OCR2Word.spec
          Copy-Item -Recurse -Force build\tesseract dist\OCR2Word\tesseract
          Get-ChildItem dist\OCR2Word | Select-Object Name, Length

      - name: Chạy thử bản đóng gói
        run: |
          $cli = "dist\OCR2Word\ocr2word-cli.exe"
          function Check($what) { if ($LASTEXITCODE -ne 0) { throw "$what thất bại (mã $LASTEXITCODE)" } }
          & $cli --version; Check "--version"
          & $cli --check; Check "--check"
          & $cli --selftest; Check "Giao diện (Tcl/Tk trong bản đóng gói)"
          python tests\make_sample.py build\sample.png
          & $cli build\sample.png -o build\out --txt; Check "Chuyển ảnh"
          Get-Content build\out\sample.txt -Encoding utf8 | Select-Object -First 3
          if (-not (Test-Path build\out\sample.docx)) { throw "Không tạo được file Word" }

          # PDF scan 3 trang (không có lớp chữ): OCR song song nhiều tiến trình trong bản đóng gói,
          # đường dẫn có dấu + dấu cách, TESSDATA_PREFIX cũ trỏ sai chỗ (máy từng cài Tesseract khác)
          python -c "from PIL import Image; im = Image.open('build/sample.png').convert('RGB'); im.save('build/scan3.pdf', save_all=True, append_images=[im, im], resolution=300)"
          $dir = Join-Path $env:RUNNER_TEMP "Thư mục thử nghiệm"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pdf = Join-Path $dir "Tài liệu quét 3 trang.pdf"
          Copy-Item build\scan3.pdf $pdf
          $env:TESSDATA_PREFIX = "C:\khong-co\tessdata"
          & $cli $pdf -o (Join-Path $dir "Kết quả") --txt; Check "PDF scan nhiều trang"
          Remove-Item Env:TESSDATA_PREFIX
          $txt = Get-Content (Join-Path $dir "Kết quả\Tài liệu quét 3 trang.txt") -Raw -Encoding utf8
          $n = ([regex]::Matches($txt, "English paragraph")).Count
          if ($n -lt 3) { throw "PDF 3 trang chỉ đọc được $n trang" }

          # bản đóng gói nằm trong thư mục có dấu (cài cho riêng người dùng có tên tiếng Việt), chỉ định --tessdata
          $inst = Join-Path $env:TEMP "Nguyễn Văn A\OCR2Word"
          New-Item -ItemType Directory -Force -Path $inst | Out-Null
          Copy-Item -Recurse -Force dist\OCR2Word\* $inst
          $cli2 = Join-Path $inst "ocr2word-cli.exe"
          & $cli2 build\sample.png -o build\out3 --txt; Check "Chạy từ thư mục có dấu"
          & $cli2 build\sample.png -o build\out4 --tessdata (Join-Path $inst "tesseract\tessdata"); Check "--tessdata có dấu"
          foreach ($f in @("build\out3\sample.docx", "build\out4\sample.docx")) { if (-not (Test-Path $f)) { throw "Thiếu $f" } }
          if (-not ((Get-Content build\out3\sample.txt -Raw -Encoding utf8) -match "tiếng Việt")) { throw "OCR sai khi chạy từ thư mục có dấu" }

      - name: Tạo bản portable (.zip)
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          Compress-Archive -Path dist\OCR2Word\* -DestinationPath "dist\installer\OCR2Word-${{ steps.ver.outputs.version }}-portable-win64.zip" -Force

      - name: Tạo bộ cài (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\OCR2Word.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup lỗi" }
          Get-ChildItem dist\installer

      - name: Cài thử bộ cài (im lặng), chạy bản đã cài rồi gỡ
        run: |
          $setup = Get-ChildItem dist\installer\*-Setup-win64.exe | Select-Object -First 1
          $dir = Join-Path $env:LOCALAPPDATA "Programs\OCR2Word thử"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=""$dir""" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Bộ cài lỗi (mã $($p.ExitCode))" }
          $cli = Join-Path $dir "ocr2word-cli.exe"
          if (-not (Test-Path (Join-Path $dir "OCR2Word.exe"))) { throw "Bộ cài thiếu OCR2Word.exe" }
          & $cli --check
          if ($LASTEXITCODE -ne 0) { throw "Bản đã cài không chạy được" }
          & $cli build\sample.png -o build\out_installed
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path build\out_installed\sample.docx)) { throw "Bản đã cài không chuyển được ảnh" }
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          Write-Host "Gỡ cài đặt: mã $($u.ExitCode)"

      # Bản phát hành đã chứa file cài đặt; artifact chỉ cho lần push thường, giữ 2 ngày
      # (mỗi bản ~380 MB, giữ lâu sẽ hết hạn mức lưu trữ và làm hỏng cả bước phát hành)
      - name: Lưu kết quả build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OCR2Word-${{ steps.ver.outputs.version }}-windows
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 2

      - name: Phát hành (Release)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: OCR2Word ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/installer/*
          body: |
            **OCR2Word ${{ steps.ver.outputs.version }}** - chuyển ảnh có chữ (Việt / Anh / Nga) thành file Word, giữ bố cục và bảng.

            - `OCR2Word-*-Setup-win64.exe`: bộ cài cho Windows 10/11 64-bit (đã kèm Tesseract + dữ liệu vie/eng/rus, không cần cài Python).
            - `OCR2Word-*-portable-win64.zip`: bản chạy ngay không cần cài, giải nén rồi mở `OCR2Word.exe`.
